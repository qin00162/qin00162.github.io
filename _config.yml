# Welcome to Jekyll!
#
# Site-wide configuration for Jiayin Qin's academic homepage.
# Note: changes to this file require restarting `jekyll serve`.

# ============================================================
# Basic Site Settings
# ============================================================

locale                   : "en-US"
title                    : "Jiayin Qin"
title_separator          : "-"
name                     : &name "Jiayin Qin"

description              : &description "A third-year Ph.D. student at the University of Minnesota working on computer architecture, AI hardware, hardware-software co-design, and AI-assisted hardware design."

url                      : "https://qin00162.github.io"
baseurl                  : ""
repository               : "qin00162/qin00162.github.io"


# ============================================================
# Site Author
# ============================================================

author:
  # Biographic information
  avatar           : "qin.jpg"
  name             : "Jiayin Qin"
  pronouns         : "she/her"

  bio              : "Ph.D. student at the University of Minnesota working on computer architecture, AI hardware, and hardware-software co-design."

  location         : "Minneapolis, MN"
  employer         : "University of Minnesota"
  uri              : "https://qin00162.github.io"
  email            : "qin00162@umn.edu"

  # Academic websites
  arxiv            :
  googlescholar    :
  impactstory      :
  orcid            :
  semantic         :
  pubmed           :
  researchgate     :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "qin00162"
  kaggle           :
  stackoverflow    :

  # Social media
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         :
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :


# ============================================================
# Publication Categories
# ============================================================

publication_category:
  books:
    title: "Books"

  manuscripts:
    title: "Preprints"

  conferences:
    title: "Conference Papers"


# ============================================================
# Site Settings
# ============================================================

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false


# ============================================================
# Comments
# ============================================================

comments:
  provider               :

  disqus:
    shortname            :

  discourse:
    server               :

  facebook:
    appid                :
    num_posts            :
    colorscheme          :


# ============================================================
# Staticman
# ============================================================

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']

  transforms:
    email                : "md5"

  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"


# ============================================================
# Atom Feed
# ============================================================

atom_feed:
  hide                   : false
  path                   :


# ============================================================
# SEO
# ============================================================

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# ============================================================
# Social Sharing
# ============================================================

twitter:
  username               : &twitter

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 :


# ============================================================
# Social Profiles
# ============================================================

social:
  type                   : "Person"
  name                   : "Jiayin Qin"

  links:
    - "https://github.com/qin00162"
    - "https://qin00162.github.io"


# ============================================================
# Analytics
# ============================================================

analytics:
  provider               : "false"

  google:
    tracking_id          :


# ============================================================
# Reading Files
# ============================================================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"

markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# ============================================================
# Conversion
# ============================================================

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# ============================================================
# Markdown Processing
# ============================================================

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# ============================================================
# Collections
# ============================================================

collections:
  teaching:
    output: true
    permalink: /:collection/:path/

  publications:
    output: true
    permalink: /:collection/:path/

  portfolio:
    output: true
    permalink: /:collection/:path/

  talks:
    output: true
    permalink: /:collection/:path/


# ============================================================
# Default Layout Settings
# ============================================================

defaults:

  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: false

  # Portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: false

  # Talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# ============================================================
# Sass / SCSS
# ============================================================

sass:
  sass_dir: _sass
  style: compressed


# ============================================================
# Output
# ============================================================

permalink: /:categories/:title/

# paginate: 5
# paginate_path: /page:num/

timezone: America/Chicago


# ============================================================
# Plugins
# ============================================================

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from


# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# ============================================================
# Archives
# ============================================================

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# Optional jekyll-archives configuration
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# ============================================================
# HTML Compression
# ============================================================

compress_html:
  clippings: all

  ignore:
    envs: development